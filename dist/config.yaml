# 自动生成：请修改 config.yaml 或 rule_provider/，不要直接编辑本文件。
mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: true
tcp-concurrent: true
unified-delay: true
find-process-mode: 'off'
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  listen: 127.0.0.1:7874
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - localhost.ptlogin2.qq.com
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
proxy-providers:
  机场订阅:
    type: http
    url: https://example.invalid/replace-with-your-subscription
    path: ./proxy_provider/msm-nodes.yaml
    interval: 3600
    header:
      User-Agent:
      - mihomo
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      lazy: true
